[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nz-accessible-topo"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "fonttools>=4.40",
    "matplotlib>=3.8",
    "contourpy>=1.2",
    "markdown==3.7",
    "tifffile>=2024.1",
    "imagecodecs>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]
site = [
    "playwright",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nzat"]

[tool.ruff]
src = ["src", "tools", "tests"]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
