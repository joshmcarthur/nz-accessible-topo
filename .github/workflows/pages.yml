name: pages

on:
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Pages deploy runs from main."
          exit 1

  checks:
    needs: guard
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: uv sync --frozen
      - name: Build site data
        run: |
          uv run python tools/extract_graph.py
          uv run python tools/export_tokens.py
          uv run python tools/build_site_assets.py
      - name: Build site
        working-directory: site
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path || '/' }}
        run: npm ci && npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
