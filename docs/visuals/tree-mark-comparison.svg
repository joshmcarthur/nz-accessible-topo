<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="system-ui, sans-serif" font-size="13">
  <title>Tree point mark candidates (enlarged 80× for viewing; labels give true sheet mm)</title>
  <style>
    .lbl { fill: #333; }
    .sub { fill: #666; font-size: 11px; }
    .bg-native { fill: #E1EAC3; }
    .bg-paper { fill: #fff; stroke: #ccc; stroke-width: 0.5; }
  </style>
  <text x="20" y="28" class="lbl" font-size="16" font-weight="600">Tree marks at map scale (each dot enlarged 80× so you can see shape)</text>
  <text x="20" y="48" class="sub">Map size 0.0625 mm is about 0.7 px at 300 dpi. Stroke options shown at 0.25 mm for shape review; apply only if you pick one.</text>

  <!-- Column headers -->
  <text x="120" y="78" class="lbl" text-anchor="middle">A  LINZ tree.svg</text>
  <text x="120" y="94" class="sub" text-anchor="middle">filled circle · 0.0625 mm</text>
  <text x="320" y="78" class="lbl" text-anchor="middle">B  third_arc (scrub mark)</text>
  <text x="320" y="94" class="sub" text-anchor="middle">stroke only · 0.25 mm trial</text>
  <text x="520" y="78" class="lbl" text-anchor="middle">C  owned tree (Maki-informed)</text>
  <text x="520" y="94" class="sub" text-anchor="middle">crown + trunk · 0.2 mm map</text>

  <text x="20" y="130" class="lbl">On paper</text>
  <rect x="60" y="110" width="600" height="140" class="bg-paper"/>

  <g transform="translate(120,180) scale(80)">
    <circle r="0.03125" fill="#008A00"/>
  </g>
  <g transform="translate(320,180) scale(80)">
    <!-- Approximation of QGIS third_arc: one parenthesis stroke -->
    <path d="M -0.08,0.12 Q -0.14,0 -0.08,-0.12" fill="none" stroke="#008A00" stroke-width="0.036" stroke-linecap="round"/>
  </g>
  <g transform="translate(520,180) scale(80)">
    <line x1="0" y1="0.13" x2="0" y2="0.07" stroke="#008A00" stroke-width="0.028" stroke-linecap="round"/>
    <path fill="none" stroke="#008A00" stroke-width="0.028" stroke-linejoin="round"
      d="M0 0.07 C-0.025 0.07 -0.04 0.04 -0.025 0.018 C-0.015 0.005 0 0.015 0 0.015 C0 0.015 0.015 0.005 0.025 0.018 C0.04 0.04 0.025 0.07 0 0.07"/>
  </g>

  <text x="20" y="290" class="lbl">On native fill #E1EAC3</text>
  <rect x="60" y="270" width="600" height="140" class="bg-native" stroke="#859E3E" stroke-width="0.5"/>

  <g transform="translate(120,340) scale(80)">
    <circle r="0.03125" fill="#008A00"/>
  </g>
  <g transform="translate(320,340) scale(80)">
    <path d="M -0.08,0.12 Q -0.14,0 -0.08,-0.12" fill="none" stroke="#008A00" stroke-width="0.036" stroke-linecap="round"/>
  </g>
  <g transform="translate(520,340) scale(80)">
    <line x1="0" y1="0.13" x2="0" y2="0.07" stroke="#008A00" stroke-width="0.028" stroke-linecap="round"/>
    <path fill="none" stroke="#008A00" stroke-width="0.028" stroke-linejoin="round"
      d="M0 0.07 C-0.025 0.07 -0.04 0.04 -0.025 0.018 C-0.015 0.005 0 0.015 0 0.015 C0 0.015 0.015 0.005 0.025 0.018 C0.04 0.04 0.025 0.07 0 0.07"/>
  </g>

  <text x="20" y="440" class="sub">Scrub uses the same third_arc shape at 1.4 mm on a 3 mm grid inside polygons (#6A9A50).</text>
  <text x="20" y="458" class="sub">Tree points cannot use pattern fill (that is for areas). You can reuse the mark shape on points at ~0.06250.25 mm in #008A00.</text>
  <text x="20" y="490" class="sub">SVG: src/nzat/qgis/symbols/nztopo50_tree_stroke.svg (crown shape informed by Mapbox Maki park, CC0).</text>
</svg>
